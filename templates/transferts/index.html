{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Transferts CT">
<title>Transferts CT</title>
<!--
  Page unique de l'application Transferts CT (single page app sans build).

  Rôle : servir la coquille HTML que le JavaScript remplit ensuite. Aucune
  donnée n'est rendue côté serveur : Django ne fait que livrer ce fichier et
  les ressources statiques.

  Trois points de montage, remplis par les scripts :
    #root    tout l'écran : connexion, puis en-tête + navigation + vue
    #sheet   feuille modale (dialogues de détail, formulaires courts)
    #toast   message temporaire de confirmation ou d'erreur
    #camera  champ fichier caché servant d'appareil photo

  Ordre de chargement des scripts (tous en defer, donc exécutés après le
  parsing, dans l'ordre) :
    core.js     socle partagé : référentiels, état, stockage, synchro, photos
    shell.js    coquille : feuille modale, navigation, render(), connexion
    rotations.js  rotations et incidents
    pointage.js   pointages, réception, vue CT
    ordres.js     ordres, programme, flotte
    suivi.js      convois, tableau de bord, réglages, export + démarrage
  Chaque module s'appuie sur les fonctions globales du précédent.

  Le CSS est intégré ci-dessous (pas de fichier séparé ni d'étape de build) :
  le navigateur n'a qu'une requête à faire pour la page et ses styles.
  Seule dépendance externe : SheetJS (xlsx.full.min.js), chargée par CDN et
  utilisée uniquement par l'export Excel ; sans réseau, l'export affiche une
  erreur mais le reste de l'application continue de fonctionner.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F3A5F'/%3E%3Crect x='10' y='22' width='30' height='20' rx='2' fill='%23fff'/%3E%3Cpath d='M40 28h8l6 7v7H40z' fill='%23AEC4DA'/%3E%3Ccircle cx='20' cy='45' r='4' fill='%23F2B84B'/%3E%3Ccircle cx='46' cy='45' r='4' fill='%23F2B84B'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   FEUILLE DE STYLE — Transferts CT
   =====================================================================
   Organisation, dans l'ordre du fichier :
     jetons (couleurs, rayons, hauteurs) → base → barre haute → journée →
     mise en page et navigation → titres/cartes → formulaires → boutons →
     pastilles → listes → indicateurs et tableaux → jalons → photos →
     feuille modale → connexion → message → bandeaux d'alerte.

   Conventions :
     - mobile d'abord ; le point de rupture unique est min-width:900px, qui
       fait apparaître la barre latérale et passe les listes en colonnes ;
     - classes construites par le JS : les noms d'états (.on, .done, .next,
       .ok, .warn, .err, .d, .n, .f) doivent rester synchronisés avec
       static/transferts/js/*.js ;
     - aucune couleur en dur hors des jetons --* ci-dessous, sauf quelques
       teintes contextuelles (jaune des plaques, gris des pastilles).
   ===================================================================== */

/* Jetons de design : couleurs, rayons et dimensions partagés par tout le CSS. */
:root{
  --navy:#1F3A5F;--navy2:#16283f;--accent:#2E6E8E;--accent-soft:#e3eff5;--bg:#EEF2F6;--card:#fff;--ink:#1A2430;--muted:#66727E;
  --line:#D8E0E8;--ok:#1F8A54;--ok-soft:#e6f4ec;--warn:#B8720F;--warn-soft:#fdf2e1;--err:#C0392B;--err-soft:#fbe9e7;
  --radius:14px;--nav-h:64px;--side-w:232px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.hidden{display:none!important}

/* ---------- Barre haute ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.top .brand{display:flex;align-items:center;gap:6px;white-space:nowrap}.top .brand-logo{height:32px;width:auto;display:block;background:#fff;padding:3px 6px;border-radius:4px}
.top .who{font-size:12px;color:#AEC4DA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .grow{flex:1;min-width:0}
.syncpill{border:none;border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap}
.syncpill .dot{width:9px;height:9px;border-radius:50%;background:#9fb3c6}
.syncpill.ok .dot{background:#3ecf82}.syncpill.wait .dot{background:#F2B84B}.syncpill.err .dot{background:#ff6b5b}
.iconbtn{border:none;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600}

/* ---------- Sélecteur de journée ---------- */
.daybar{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.daybar button{border:none;background:none;font-size:18px;padding:6px 12px;border-radius:8px;color:var(--navy)}
.daybar button:active{background:var(--bg)}
.daybar .dlabel{flex:1;text-align:center;font-weight:700;color:var(--navy);position:relative}
.daybar .dlabel input{position:absolute;inset:0;opacity:0;width:100%}
.daybar .today{font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent)}

/* ---------- Mise en page ---------- */
.layout{display:flex;min-height:calc(100vh - 56px)}
.side{display:none}
main{flex:1;min-width:0;padding:14px;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto;width:100%}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex}
.bottomnav button{flex:1;border:none;background:none;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.bottomnav button .ic{font-size:21px;line-height:1}
.bottomnav button.on{color:var(--navy)}
.bottomnav button.on::before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--navy)}
.badge{display:inline-block;min-width:18px;padding:1px 5px;border-radius:10px;background:var(--err);color:#fff;font-size:10px;font-weight:800;text-align:center}
.bottomnav .badge{position:absolute;top:6px;right:calc(50% - 22px)}
@media (min-width:900px){
  .side{display:block;width:var(--side-w);flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
  .side button{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);text-align:left;margin-bottom:2px}
  .side button .ic{font-size:18px;width:22px;text-align:center}
  .side button.on{background:var(--accent-soft);color:var(--navy)}
  .side button .badge{margin-left:auto}
  .bottomnav{display:none}
  main{padding:22px 26px 40px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .cols{display:grid;grid-template-columns:minmax(340px,420px) 1fr;gap:18px;align-items:start}
  .cols>.sticky{position:sticky;top:76px}
}

/* ---------- Titres et cartes ---------- */
h1.page{font-size:21px;margin:2px 2px 12px;color:var(--navy)}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 2px 8px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,40,60,.04)}
.card.tight{padding:10px 12px}
.muted{color:var(--muted)}.small{font-size:12px}.center{text-align:center}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px;background:#fff;border:1px dashed var(--line);border-radius:var(--radius)}

/* ---------- Formulaires ---------- */
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px}
input.in,select.in,textarea.in{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
textarea.in{min-height:64px}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,110,142,.18)}
.in.big{font-size:20px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.seg{display:flex;background:#e9eef3;border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;color:var(--muted);padding:11px 6px;font-size:15px;font-weight:700;border-radius:9px}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.sm button{padding:7px 6px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1}

/* ---------- Boutons ---------- */
.btn{border:none;border-radius:11px;padding:13px 16px;font-size:15px;font-weight:700;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{filter:brightness(.92)}
.btn.block{width:100%}
.btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.soft{background:var(--accent-soft);color:var(--navy)}
.btn.ok{background:var(--ok)}.btn.err{background:var(--err)}.btn.accent{background:var(--accent)}
.btn.ghost{background:none;color:var(--accent);padding:8px 10px}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn.xl{padding:17px 18px;font-size:17px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>.btn{flex:1}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:25;border:none;border-radius:28px;padding:15px 20px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(20,40,60,.3)}
@media (min-width:900px){.fab{bottom:24px;right:28px}}

/* ---------- Pastilles ---------- */
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.2px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.err{background:var(--err-soft);color:var(--err)}
.pill.info{background:var(--accent-soft);color:var(--accent)}.pill.grey{background:#eef2f6;color:#5a6773}

/* ---------- Listes ---------- */
.item{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.item .t{font-weight:800;font-size:16px}
.item .s{font-size:13px;color:var(--muted);margin-top:3px}
.item .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.item .acts .btn{flex:1}
.item.clickable{cursor:pointer}
.plate{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;background:#FFF6D6;border:1.5px solid #1A2430;border-radius:6px;padding:1px 7px;font-size:14px;letter-spacing:.5px}
.steps{display:flex;gap:3px;margin-top:9px}
.steps i{flex:1;height:6px;border-radius:3px;background:#e2e8ee}
.steps i.d{background:var(--ok)}.steps i.n{background:#F2B84B}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}.kv .k{color:var(--muted)}

/* ---------- Indicateurs ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:13px}
.kpi .n{font-size:26px;font-weight:800;color:var(--navy);line-height:1.1}
.kpi .n small{font-size:14px;color:var(--muted);font-weight:700}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-top:3px}
.bar{height:8px;background:#e7edf3;border-radius:6px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--accent);border-radius:6px}
.bar.ok>div{background:var(--ok)}
table.tb{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
table.tb th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:9px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
table.tb td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}

/* ---------- Jalons ---------- */
.jal{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.jal:last-child{border-bottom:none}
.jal .num{width:26px;height:26px;border-radius:50%;background:#eef2f6;color:var(--muted);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.jal.done .num{background:var(--ok);color:#fff}
.jal.next .num{background:#F2B84B;color:#1A2430}
.jal .jn{flex:1;min-width:0;font-size:14px}
.jal .jn small{display:block;color:var(--muted);font-size:11px}
.jal .tm{font-variant-numeric:tabular-nums;font-weight:800;min-width:48px;text-align:right}
.jal input[type=time]{width:96px;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.switch{width:48px;height:28px;border-radius:20px;background:#d3dbe3;position:relative;flex-shrink:0;border:none}
.switch.on{background:var(--ok)}.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.switch.on::after{left:23px}.switch[disabled]{opacity:.5}

/* ---------- Codes d'accès (Réglages) ---------- */
.code-row{padding:10px 0;border-bottom:1px dashed var(--line)}
.code-row:last-child{border-bottom:none}
.code-row .code-label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px}

/* ---------- Photos ---------- */
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ph{border:1.5px dashed var(--line);border-radius:12px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:13px;font-weight:700;background:#fafcfd;position:relative;overflow:hidden;cursor:pointer}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:14px;z-index:2}
.ph .ic{font-size:24px}

/* ---------- Feuille (dialogue) ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#d3dbe3;margin:-4px auto 10px}
.sheet h3{margin:0 0 4px;font-size:18px;color:var(--navy)}
@media (min-width:900px){.sheet-bg{align-items:center}.sheet{border-radius:18px;max-width:680px}.sheet .grab{display:none}}

/* ---------- Connexion ---------- */
.login{min-height:100vh;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;padding:24px 18px}
.login .box{width:100%;max-width:460px}
.login h1{font-size:24px;margin:18px 0 4px}.login p{color:#AEC4DA;margin:0 0 18px;font-size:14px}
.login .grp{color:#AEC4DA;font-size:12px;text-transform:uppercase;letter-spacing:.8px;margin:14px 2px 8px;font-weight:800}
.rolecard{background:#fff;color:var(--ink);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;border:2px solid transparent}
.rolecard:active,.rolecard.on{border-color:#F2B84B}
.rolecard .ri{font-size:26px}.rolecard .rt{font-weight:800;font-size:16px}.rolecard .rd{font-size:12px;color:var(--muted);margin-top:2px}
.entgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.entgrid .rolecard{margin:0;justify-content:center;font-weight:800}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pinpad button{border:none;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font-size:24px;font-weight:700;padding:16px 0}
.pinpad button:active{background:rgba(255,255,255,.25)}
.pindots{display:flex;justify-content:center;gap:14px;margin:16px 0 4px}
.pindots i{width:15px;height:15px;border-radius:50%;border:2px solid #AEC4DA}
.pindots i.f{background:#F2B84B;border-color:#F2B84B}
.login input.in{background:#fff}
.login .back{background:none;border:none;color:#AEC4DA;font-weight:700;padding:10px 0;font-size:14px}

/* ---------- Message ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-20px);top:calc(64px + env(safe-area-inset-top));background:#1A2430;color:#fff;padding:12px 18px;border-radius:24px;font-size:14px;font-weight:600;z-index:90;opacity:0;transition:.2s;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.nonav .bottomnav{display:none}body.nonav main{padding-bottom:30px}body.nonav .fab{bottom:20px}
.toast.err{background:var(--err)}

.banner{background:var(--warn-soft);color:#7a4c0a;border:1px solid #f0d3a2;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner.err{background:var(--err-soft);color:#8d2a1f;border-color:#f1c4bd}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>
<!-- Écran complet : render() (shell.js) réécrit ce conteneur à chaque rendu. -->
<div id="root"></div>
<!-- Feuille modale : openSheet() y injecte son contenu, closeSheet() le vide. -->
<div id="sheet"></div>
<div class="toast" id="toast"></div>
<!-- Message éphémère : la classe .show est ajoutée puis retirée par toast(). -->
<!-- Appareil photo : takePhoto() programme ce champ puis simule un clic. -->
<input type="file" accept="image/*" capture="environment" id="camera" class="hidden">
<!-- Scripts applicatifs, dans l'ordre de dépendance (voir l'en-tête). -->
<script src="{% static 'transferts/js/core.js' %}" defer></script>
<script src="{% static 'transferts/js/shell.js' %}" defer></script>
<script src="{% static 'transferts/js/rotations.js' %}" defer></script>
<script src="{% static 'transferts/js/pointage.js' %}" defer></script>
<script src="{% static 'transferts/js/ordres.js' %}" defer></script>
<script src="{% static 'transferts/js/suivi.js' %}" defer></script>
</body>
</html>
